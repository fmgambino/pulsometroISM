<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><rect width="1600" height="1320" fill="#f3f6fb"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18304c} .wire{fill:none;stroke:#176aab;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.gnd{fill:none;stroke:#273b50;stroke-width:4}.component{fill:white;stroke:#18304c;stroke-width:3}</style><rect x="0" y="0" width="1600" height="165" rx="0" fill="#102e50" stroke="#102e50" stroke-width="2"/><text x="50" y="60" font-size="38" style="fill:white" font-weight="bold">PULSÓMETRO · Diagrama de conexión</text><text x="50" y="104" font-size="22" style="fill:#d9e8fa">ESP32 DevKit WROOM-32 · Framework Arduino · OLED SSD1306 128 × 64</text><text x="50" y="139" font-size="20" style="fill:#d9e8fa">Diseño y Desarrollo del Club de Robótica e IA · Instituto San Miguel</text><rect x="40" y="185" width="1520" height="86" rx="18" fill="#e1ecfa" stroke="#d4dfec" stroke-width="2"/><text x="65" y="220" font-size="22" font-weight="bold">ALIMENTACIÓN: conectar la ESP32 por USB de 5 V.</text><text x="65" y="251" font-size="21">Las etiquetas iguales pertenecen a la misma red: unir todos los GND. GPIO y detección: solo 3,3 V.</text><rect x="40" y="295" width="735" height="335" rx="18" fill="white" stroke="#d4dfec" stroke-width="2"/><rect x="60" y="313" width="38" height="38" rx="10" fill="#123c66" stroke="#123c66" stroke-width="2"/><text x="71" y="340" font-size="23" style="fill:white" font-weight="bold">1</text><text x="115" y="340" font-size="25" font-weight="bold">Pantalla OLED I²C</text><rect x="510" y="385" width="205" height="215" rx="18" fill="#112a44" stroke="#112a44" stroke-width="2"/><rect x="530" y="400" width="165" height="65" rx="5" fill="#071421" stroke="#426085" stroke-width="2"/><text x="548" y="440" font-size="17" style="fill:#9ceeff">PULSÓMETRO</text><text x="75" y="496" font-size="20">ESP32 3V3</text><polyline class="wire" points="260,490 520,490"/><text x="540" y="496" font-size="17" style="fill:white">VCC</text><circle cx="520" cy="490" r="6" fill="#176aab"/><text x="75" y="526" font-size="20">ESP32 GND</text><polyline class="wire" points="260,520 520,520"/><text x="540" y="526" font-size="17" style="fill:white">GND</text><circle cx="520" cy="520" r="6" fill="#176aab"/><text x="75" y="556" font-size="20">ESP32 GPIO21</text><polyline class="wire" points="260,550 520,550"/><text x="540" y="556" font-size="17" style="fill:white">SDA</text><circle cx="520" cy="550" r="6" fill="#176aab"/><text x="75" y="586" font-size="20">ESP32 GPIO22</text><polyline class="wire" points="260,580 520,580"/><text x="540" y="586" font-size="17" style="fill:white">SCL</text><circle cx="520" cy="580" r="6" fill="#176aab"/><text x="75" y="365" font-size="20">Dirección I²C del firmware: 0x3C</text><text x="75" y="620" font-size="18">Guiarse por VCC/GND/SDA/SCL, no por el orden físico de pines.</text><rect x="800" y="295" width="760" height="335" rx="18" fill="white" stroke="#d4dfec" stroke-width="2"/><rect x="820" y="313" width="38" height="38" rx="10" fill="#123c66" stroke="#123c66" stroke-width="2"/><text x="831" y="340" font-size="23" style="fill:white" font-weight="bold">2</text><text x="875" y="340" font-size="25" font-weight="bold">Detección del contacto</text><text x="835" y="380" font-size="19">ESP32</text><text x="835" y="410" font-size="22" font-weight="bold">GPIO27</text><polyline class="wire" points="865,440 950,440 1010,440"/><circle cx="950" cy="440" r="6" fill="#176aab"/><polyline class="wire" points="950,440 950,380 1020,380"/><polyline class="wire" points="1020,380 1030,380"/><rect x="1030" y="370" width="70" height="20" class="component"/><polyline class="wire" points="1100,380 1110,380"/><polyline class="wire" points="1110,380 1160,380"/><text x="1030" y="363" font-size="18">10 kΩ</text><text x="1170" y="386" font-size="19">3V3</text><polyline class="wire" points="1010,440 1020,440"/><rect x="1020" y="430" width="80" height="20" class="component"/><polyline class="wire" points="1100,440 1110,440"/><text x="1035" y="420" font-size="20">1 kΩ</text><polyline class="wire" points="1110,440 1260,440"/><circle cx="1260" cy="440" r="6" fill="#176aab"/><text x="1160" y="410" font-size="18" font-weight="bold">COBRE DESNUDO</text><polyline class="wire" points="1260,440 1290,440"/><circle cx="1294" cy="440" r="5" class="component"/><circle cx="1375" cy="440" r="5" class="component"/><polyline class="wire" points="1370,437 1310,404"/><polyline class="wire" points="1380,440 1455,440 1455,500"/><polyline class="gnd" points="1455,500 1455,515"/><polyline class="gnd" points="1435,515 1475,515"/><polyline class="gnd" points="1442,523 1468,523"/><polyline class="gnd" points="1449,531 1461,531"/><text x="1330" y="390" font-size="19" font-weight="bold">ARO</text><text x="1300" y="570" font-size="18">Cable flexible → GND</text><text x="835" y="510" font-size="19">El circuito se cierra cuando el aro toca el cobre.</text><text x="835" y="600" font-size="17">El pull-up de 10 kΩ va del GPIO27 a 3V3, antes de la resistencia de 1 kΩ.</text><rect x="40" y="655" width="735" height="395" rx="18" fill="white" stroke="#d4dfec" stroke-width="2"/><rect x="60" y="673" width="38" height="38" rx="10" fill="#123c66" stroke="#123c66" stroke-width="2"/><text x="71" y="700" font-size="23" style="fill:white" font-weight="bold">3</text><text x="115" y="700" font-size="25" font-weight="bold">Pulsador de llegada B</text><text x="80" y="760" font-size="23" font-weight="bold">ESP32 GPIO33</text><polyline class="wire" points="280,755 350,755 350,820 410,820"/><circle cx="415" cy="820" r="6" class="component"/><circle cx="510" cy="820" r="6" class="component"/><polyline class="wire" points="422,795 504,795"/><polyline class="wire" points="463,795 463,770"/><polyline class="wire" points="516,820 650,820 650,870"/><polyline class="gnd" points="650,870 650,885"/><polyline class="gnd" points="630,885 670,885"/><polyline class="gnd" points="637,893 663,893"/><polyline class="gnd" points="644,901 656,901"/><text x="395" y="875" font-size="21">Pulsador N.A.</text><text x="80" y="936" font-size="21">Un terminal a GPIO33; el otro a GND.</text><text x="80" y="972" font-size="19">Pull-up interno activado por el firmware.</text><text x="80" y="1006" font-size="18">En uno de 4 patas, usar contactos que se unan al presionarlo.</text><rect x="800" y="655" width="760" height="395" rx="18" fill="white" stroke="#d4dfec" stroke-width="2"/><rect x="820" y="673" width="38" height="38" rx="10" fill="#123c66" stroke="#123c66" stroke-width="2"/><text x="831" y="700" font-size="23" style="fill:white" font-weight="bold">4</text><text x="875" y="700" font-size="25" font-weight="bold">Buzzer pasivo + transistor NPN</text><text x="835" y="855" font-size="20" font-weight="bold">GPIO25</text><polyline class="wire" points="855,880 970,880"/><polyline class="wire" points="970,880 980,880"/><rect x="980" y="870" width="70" height="20" class="component"/><polyline class="wire" points="1050,880 1060,880"/><text x="987" y="855" font-size="20">1 kΩ</text><polyline class="wire" points="1060,880 1120,880"/><circle cx="1080" cy="880" r="6" fill="#176aab"/><circle cx="1165" cy="880" r="45" class="component"/><polyline class="wire" points="1120,880 1145,880"/><polyline class="wire" points="1145,851 1145,909"/><polyline class="wire" points="1145,866 1180,840 1180,810"/><polyline class="wire" points="1145,895 1180,920 1180,960"/><polygon points="1178,918 1161,913 1171,901" fill="#176aab"/><polyline class="gnd" points="1180,960 1180,975"/><polyline class="gnd" points="1160,975 1200,975"/><polyline class="gnd" points="1167,983 1193,983"/><polyline class="gnd" points="1174,991 1186,991"/><text x="1215" y="867" font-size="20" font-weight="bold">2N2222</text><text x="1215" y="893" font-size="20">o BC337</text><text x="1110" y="866" font-size="17">B</text><text x="1190" y="840" font-size="17">C</text><text x="1190" y="935" font-size="17">E</text><polyline class="wire" points="1080,905 1080,915"/><rect x="1070" y="915" width="20" height="35" class="component"/><polyline class="wire" points="1080,950 1080,960"/><polyline class="wire" points="1080,880 1080,905"/><polyline class="gnd" points="1080,960 1080,975"/><polyline class="gnd" points="1060,975 1100,975"/><polyline class="gnd" points="1067,983 1093,983"/><polyline class="gnd" points="1074,991 1086,991"/><text x="985" y="939" font-size="19">10 kΩ</text><circle cx="1180" cy="772" r="32" class="component"/><polyline class="wire" points="1180,740 1180,721 1410,721"/><text x="1240" y="741" font-size="20" font-weight="bold">+V del buzzer</text><text x="1230" y="767" font-size="18">3,3 V o 5 V según modelo</text><polyline class="wire" points="1180,804 1180,810"/><text x="1165" y="762" font-size="22">+</text><text x="1165" y="792" font-size="22">−</text><text x="1230" y="797" font-size="19">Piezo PASIVO</text><text x="840" y="1025" font-size="17">Verificar B/C/E del transistor: el orden de patas depende del fabricante.</text><rect x="40" y="1075" width="1520" height="210" rx="18" fill="#e1ecfa" stroke="#d4dfec" stroke-width="2"/><text x="65" y="1115" font-size="25" font-weight="bold">Notas de montaje</text><text x="65" y="1152" font-size="21">• No conectar directamente el buzzer al GPIO25: usar la etapa NPN del dibujo.</text><text x="65" y="1185" font-size="21">• Este esquema usa piezo pasivo. Si el buzzer es magnético/inductivo, agregar diodo de protección.</text><text x="65" y="1218" font-size="21">• No aplicar 5 V a un GPIO. El aro y el cobre solo llevan señales de detección a baja tensión.</text><text x="65" y="1251" font-size="21">• En OLED SH1106 u otra placa ESP32, revisar controlador y pines antes del montaje.</text></svg>